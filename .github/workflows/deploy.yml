name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GITHUB_SHA,GITHUB_REF_NAME
          script: |
            set -euo pipefail
            echo "Starting deployment..."

            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Sync repository to the exact commit that triggered this workflow
            cd app
            git fetch --all --prune
            git checkout "$GITHUB_REF_NAME"
            git reset --hard "$GITHUB_SHA"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            cd ..

            # Copy nginx config
            cp docker/nginx.conf app/nginx.conf

            # Resolve frontend service name from compose file
            SERVICE_NAME="$(docker compose config --services | grep -E '^(vite-app|app|frontend)$' | head -n 1 || true)"
            if [ -z "$SERVICE_NAME" ]; then
              echo "No frontend service name matched (vite-app|app|frontend). Available services:"
              docker compose config --services
              exit 1
            fi

            # Rebuild and restart frontend service with fresh image layers
            docker compose down
            docker compose build --no-cache --pull "$SERVICE_NAME"
            docker compose up -d --force-recreate "$SERVICE_NAME"

            # Health check
            sleep 15
            curl -f http://localhost:9001/health || exit 1

            echo "Deployment successful."
